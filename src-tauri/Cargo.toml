[package]
name = "focusbar"
version = "0.3.0"
description = "Assistente de produtividade local"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "focusbar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
active-win-pos-rs = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
user-idle = "0.6"
chrono = "0.4"
reqwest = { version = "0.12", features = ["json"] }
regex = "1"
tauri-plugin-clipboard-manager = "2.3.2"
xcap = "0.9.6"
image = "0.25"
uni-ocr = "0.1.5"

# Captura de título da janela no macOS via API de Acessibilidade (AX),
# e checagem/solicitação da permissão de Acessibilidade. Só compila no macOS.
[target.'cfg(target_os = "macos")'.dependencies]
accessibility = "0.1"
accessibility-sys = "0.1"
core-foundation = "0.9"
macos-accessibility-client = "0.0.1"

