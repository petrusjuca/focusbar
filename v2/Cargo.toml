[package]
name = "focusbar-core"
version = "2.0.0-alpha.1"
description = "focusbar v2 — core local: captura → tabela bruta → derivador → API"
edition = "2021"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
